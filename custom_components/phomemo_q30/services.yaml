print_text:
  fields:
    text:
      required: true
      example: "Szeretlek\nHome Assistant"
      selector:
        text:
          multiline: true
    device_id:
      selector:
        device:
          integration: phomemo_q30
    font_size:
      default: 0
      selector:
        number:
          min: 0
          max: 250
          mode: box
    font:
      example: /config/fonts/MyFont.ttf
      selector:
        text:
    length_mm:
      selector:
        number:
          min: 5
          max: 200
          step: 0.5
          unit_of_measurement: mm
          mode: box
    width_mm:
      selector:
        number:
          min: 5
          max: 200
          step: 0.5
          unit_of_measurement: mm
          mode: box
    copies:
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box

print_image:
  fields:
    path:
      required: true
      example: /config/www/label.png
      selector:
        text:
    device_id:
      selector:
        device:
          integration: phomemo_q30
    rotate:
      default: 0
      selector:
        select:
          options: ["0", "90", "180", "270"]
    dither:
      default: true
      selector:
        boolean:
    length_mm:
      selector:
        number:
          min: 5
          max: 200
          step: 0.5
          unit_of_measurement: mm
          mode: box
    width_mm:
      selector:
        number:
          min: 5
          max: 200
          step: 0.5
          unit_of_measurement: mm
          mode: box
    copies:
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box

name: HACS Validation

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate-hacs:
    runs-on: "ubuntu-24.04"
    steps:
      - name: Checkout repository
        uses: "actions/checkout@v5"

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
